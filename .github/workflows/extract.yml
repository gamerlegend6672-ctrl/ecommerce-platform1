
name: Extract Ecommerce ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          ZIP_FILE="ecommerce-platform-main.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          ITEMS=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d extracted/* ]; then
            cp -a extracted/*/. .
          else
            cp -a extracted/. .
          fi

          echo "ZIP extraction completed!"

      - name: Push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset HEAD -- .github/workflows/ || true

          git diff --cached --quiet || git commit -m "Extract ecommerce project files"

          git push
